name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, and smoke check
    # A fresh macOS 15 + Xcode 16.4 Tart VM per job on the owner's Mac
    # (gl11tchy/gh-runner-broker mac/macos-supervisor.sh). Jobs wait while the Mac is off.
    runs-on: [self-hosted, sigil-vm]
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node for Sidereal
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            Sidereal/package-lock.json
            Site/package-lock.json

      - name: Show Swift toolchain
        run: swift --version

      - name: Restore Swift build cache
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}-

      - name: Install shellcheck
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install shellcheck

      - name: Check Metal toolchain
        run: xcrun --sdk macosx metal --version

      - name: Verify
        run: Scripts/verify.sh

      - name: iPhone app logic and relay tests
        run: iOS/scripts/relay-e2e.sh

      - name: Build release bundle
        if: github.event_name != 'pull_request'
        env:
          # GitHub macos-15 cannot currently produce the x86_64 half of a
          # universal bundle (SigilMCP @main). Ship a host-arch zip instead.
          SIGIL_ALLOW_THIN: "1"
        run: Scripts/build-app.sh

      - name: Zip the app
        if: github.event_name != 'pull_request'
        run: ditto -c -k --keepParent dist/Sigil.app dist/Sigil.zip

      - name: Upload app zip
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Sigil.app
          path: dist/Sigil.zip
          if-no-files-found: error

      - name: Publish latest GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A new release per run: gh uploads the zip to a draft and only then
          # publishes it as Latest, so releases/latest/download/Sigil.zip never
          # points at a release without the zip. Deleting first left it 404.
          tag="build-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" dist/Sigil.zip \
            --title "Sigil ${GITHUB_SHA::7}" \
            --notes "Built from main (\`${GITHUB_SHA}\`). Unzip and replace /Applications/Sigil.app, or from a clone: \`Scripts/install.sh\`." \
            --latest
          # Prune the builds this one replaced, the old rolling `latest`
          # release, and drafts a cancelled run left behind.
          old_tags="$(gh release list --limit 100 --json tagName --jq '.[].tagName')" \
            || { echo "::warning::could not list releases to prune"; old_tags=""; }
          for old in $old_tags; do
            [[ "$old" =~ ^(latest|build-[0-9]+\.[0-9]+)$ && "$old" != "$tag" ]] || continue
            # A draft has no tag yet, so the tag cleanup fails after the
            # release itself is gone. Warn only when the release is left.
            gh release delete "$old" --yes --cleanup-tag \
              || ! gh release view "$old" >/dev/null 2>&1 \
              || echo "::warning::could not delete release $old"
          done
