name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, and smoke check
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node for Sidereal
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Sidereal/package-lock.json

      - name: Show Swift toolchain
        run: swift --version

      - name: Restore Swift build cache
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}-

      - name: Install shellcheck
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install shellcheck

      - name: Check Metal toolchain
        run: xcrun --sdk macosx metal --version

      - name: Verify
        run: Scripts/verify.sh

      - name: Build release bundle
        if: github.event_name != 'pull_request'
        env:
          # GitHub macos-15 cannot currently produce the x86_64 half of a
          # universal bundle (SigilMCP @main). Ship a host-arch zip instead.
          SIGIL_ALLOW_THIN: "1"
        run: Scripts/build-app.sh

      - name: Zip the app
        if: github.event_name != 'pull_request'
        run: ditto -c -k --keepParent dist/Sigil.app dist/Sigil.zip

      - name: Upload app zip
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Sigil.app
          path: dist/Sigil.zip
          if-no-files-found: error

      - name: Publish latest GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/Sigil.zip \
            --title "Sigil ${GITHUB_SHA::7}" \
            --notes "Built from main (\`${GITHUB_SHA}\`). Unzip and replace /Applications/Sigil.app, or from a clone: \`Scripts/install.sh\`." \
            --latest
