name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      diagnostic_mode:
        description: Temporary REA-1216 diagnostic mode
        type: choice
        required: true
        default: path-preflight
        options:
          - path-preflight
          - native-watcher-stacks

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  path_preflight:
    name: Foundation path preflight only
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/rea-1216-verified-codex-binding' && inputs.diagnostic_mode == 'path-preflight'
    runs-on: [self-hosted, sigil-vm]
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run only the path preflight
        timeout-minutes: 1
        run: python3 Scripts/diagnose-native-watcher.py --preflight-only
      - name: Preserve preflight evidence
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: foundation-path-preflight-diagnostic
          path: ${{ runner.temp }}/sigil-native-watcher-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 1
          if-no-files-found: warn

  native_watcher_stacks:
    name: Native watcher stack diagnostic
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/rea-1216-verified-codex-binding' && inputs.diagnostic_mode == 'native-watcher-stacks'
    runs-on: [self-hosted, sigil-vm]
    timeout-minutes: 14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build the test executable without running tests
        timeout-minutes: 5
        run: swift build --build-tests
      - name: Capture the owned synthetic watcher process
        timeout-minutes: 7
        run: |
          bin_dir="$(swift build --show-bin-path)"
          python3 Scripts/diagnose-native-watcher.py "$bin_dir/SigilPackageTests.xctest/Contents/MacOS/SigilPackageTests"
      - name: Preserve diagnostic evidence
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: native-watcher-stack-diagnostic
          path: ${{ runner.temp }}/sigil-native-watcher-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 1
          if-no-files-found: warn

  verify:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/fix/rea-1216-verified-codex-binding'
    name: Build, test, and smoke check
    # Requires a fresh Tart VM with Xcode 26+ and an iOS 26+ runtime on the owner's Mac
    # (gl11tchy/gh-runner-broker mac/macos-supervisor.sh). Jobs wait while the Mac is off.
    runs-on: [self-hosted, sigil-vm]
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node for Sidereal
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            Sidereal/package-lock.json
            Site/package-lock.json

      - name: Show Xcode and Swift toolchain
        id: toolchain
        run: |
          toolchain="$(xcodebuild -version && swift --version)"
          printf '%s\n' "$toolchain"
          printf 'cache-key=%s\n' "$(printf '%s\n' "$toolchain" | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore Swift build cache
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles('Package.resolved') }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles('Package.resolved') }}-

      - name: Clear restored native verification evidence
        if: always()
        run: rm -rf .build/native-verification

      - name: Install shellcheck
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install shellcheck

      - name: Check Metal toolchain
        run: xcrun --sdk macosx metal --version

      - name: Verify
        run: Scripts/verify.sh

      - name: iPhone app, shipping extensions, and native relay tests
        env:
          SIGIL_NATIVE_ARTIFACTS: ${{ runner.temp }}/sigil-native-${{ github.run_id }}-${{ github.run_attempt }}
        run: iOS/scripts/ci.sh

      - name: Upload native verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-native-verification
          retention-days: 7
          path: ${{ runner.temp }}/sigil-native-${{ github.run_id }}-${{ github.run_attempt }}/*.xcresult
          if-no-files-found: error

      - name: Build release bundle
        if: github.event_name != 'pull_request'
        env:
          # GitHub macos-15 cannot currently produce the x86_64 half of a
          # universal bundle (SigilMCP @main). Ship a host-arch zip instead.
          SIGIL_ALLOW_THIN: "1"
        run: Scripts/build-app.sh

      - name: Zip the app
        id: zip_app
        if: github.event_name != 'pull_request'
        run: ditto -c -k --keepParent dist/Sigil.app dist/Sigil.zip

      - name: Publish latest GitHub Release
        id: publish_release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A new release per run: gh uploads the zip to a draft and only then
          # publishes it as Latest, so releases/latest/download/Sigil.zip never
          # points at a release without the zip. Deleting first left it 404.
          tag="build-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" dist/Sigil.zip \
            --title "Sigil ${GITHUB_SHA::7}" \
            --notes "Built from main (\`${GITHUB_SHA}\`). Unzip and replace /Applications/Sigil.app, or from a clone: \`Scripts/install.sh\`." \
            --latest
          # Prune the builds this one replaced, the old rolling `latest`
          # release, and drafts a cancelled run left behind.
          old_tags="$(gh release list --limit 100 --json tagName --jq '.[].tagName')" \
            || { echo "::warning::could not list releases to prune"; old_tags=""; }
          for old in $old_tags; do
            [[ "$old" =~ ^(latest|build-[0-9]+\.[0-9]+)$ && "$old" != "$tag" ]] || continue
            # A draft has no tag yet, so the tag cleanup fails after the
            # release itself is gone. Warn only when the release is left.
            gh release delete "$old" --yes --cleanup-tag \
              || ! gh release view "$old" >/dev/null 2>&1 \
              || echo "::warning::could not delete release $old"
          done

      - name: Upload app zip
        if: ${{ !cancelled() && steps.zip_app.outcome == 'success' && steps.publish_release.outcome != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Sigil.app
          retention-days: 7
          path: dist/Sigil.zip
          if-no-files-found: error
