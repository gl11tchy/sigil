name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      about_diagnostic:
        description: Run only the isolated About host diagnostic
        required: false
        default: false
        type: boolean
      expected_source_sha:
        description: Full reviewed source SHA, required only for About diagnostics
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.about_diagnostic == true && 'about-host-diagnostic' || format('ci-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.about_diagnostic == true) }}

jobs:
  verify:
    # A focused run must not emit a skipped check under the required gate's name.
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.about_diagnostic == true && 'Normal verification not selected for About diagnostic' || 'Build, test, and smoke check' }}
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.about_diagnostic == true) }}
    # Requires a fresh Tart VM with Xcode 26+ and an iOS 26+ runtime on the owner's Mac
    # (gl11tchy/gh-runner-broker mac/macos-supervisor.sh). Jobs wait while the Mac is off.
    runs-on: [self-hosted, sigil-vm]
    timeout-minutes: 45
    env:
      # The same numeric identity is stamped into bundles and release tags.
      SIGIL_BUILD: ${{ github.run_number }}.${{ github.run_attempt }}
      # Python fixture imports must not dirty the source being stamped.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node for Sidereal
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            Sidereal/package-lock.json
            Site/package-lock.json

      - name: Show Xcode and Swift toolchain
        id: toolchain
        run: |
          toolchain="$(xcodebuild -version && swift --version)"
          printf '%s\n' "$toolchain"
          printf 'cache-key=%s\n' "$(printf '%s\n' "$toolchain" | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore Swift build cache
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles('Package.resolved') }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles('Package.resolved') }}-

      - name: Clear restored native verification evidence
        if: always()
        run: rm -rf .build/native-verification

      - name: Install shellcheck
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install shellcheck

      - name: Check Metal toolchain
        run: xcrun --sdk macosx metal --version

      - name: Verify
        env:
          SIGIL_SIDEBAR_ARTIFACTS: ${{ runner.temp }}/sigil-sidebar-${{ github.run_id }}-${{ github.run_attempt }}
          SIGIL_SWIFT_DIAGNOSTICS: ${{ github.event_name == 'pull_request' && (github.event.pull_request.number == 142 || github.event.pull_request.number == 145) && '1' || '' }}
        run: |
          if [[ "$SIGIL_SWIFT_DIAGNOSTICS" == "1" ]]; then
            python3 Scripts/ci-swift-test-diagnostics.py
          else
            Scripts/verify.sh
          fi

      - name: Upload scoped Swift verification diagnostics
        if: always() && github.event_name == 'pull_request' && (github.event.pull_request.number == 142 || github.event.pull_request.number == 145)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: PR${{ github.event.pull_request.number }}-Swift-stall-diagnostics
          retention-days: 7
          path: ${{ runner.temp }}/sigil-swift-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}/*
          if-no-files-found: warn

      - name: Upload sidebar app-hosted verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-app-hosted-verification
          retention-days: 7
          path: ${{ runner.temp }}/sigil-sidebar-${{ github.run_id }}-${{ github.run_attempt }}/*.xcresult
          if-no-files-found: warn

      - name: iPhone app, shipping extensions, and native relay tests
        id: native_verification
        env:
          SIGIL_NATIVE_ARTIFACTS: ${{ runner.temp }}/sigil-native-${{ github.run_id }}-${{ github.run_attempt }}
        run: iOS/scripts/ci.sh

      - name: Upload native verification evidence
        if: always() && steps.native_verification.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-native-verification
          retention-days: 7
          path: ${{ runner.temp }}/sigil-native-${{ github.run_id }}-${{ github.run_attempt }}/*.xcresult
          if-no-files-found: error

      - name: Build release bundle
        env:
          # GitHub macos-15 cannot currently produce the x86_64 half of a
          # universal bundle (SigilMCP @main). Ship a host-arch zip instead.
          SIGIL_ALLOW_THIN: "1"
          # PRs verify final ZIP metadata using the already-built debug products.
          SIGIL_CONFIG: ${{ github.event_name == 'pull_request' && 'debug' || 'release' }}
        run: Scripts/build-app.sh

      - name: Zip the app
        id: zip_app
        run: |
          ditto -c -k --keepParent dist/Sigil.app dist/Sigil.zip
          python3 Scripts/build-identity.py archive dist/Sigil.zip \
            --expected-commit "$GITHUB_SHA" --expected-build "$SIGIL_BUILD"

      - name: Publish latest GitHub Release
        id: publish_release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 Scripts/build-identity.py publish dist/Sigil.zip

      - name: Upload app zip
        if: ${{ !cancelled() && steps.zip_app.outcome == 'success' && steps.publish_release.outcome != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Sigil.app
          retention-days: 7
          path: dist/Sigil.zip
          if-no-files-found: error

  about_diagnostic:
    name: Isolated About host diagnostic
    if: github.event_name == 'workflow_dispatch' && inputs.about_diagnostic == true
    runs-on: [self-hosted, sigil-vm]
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SIGIL_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
    steps:
      - name: Validate exact dispatch source
        run: |
          if [[ ! "$SIGIL_EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$GITHUB_SHA" != "$SIGIL_EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::Selected ref does not match the reviewed source SHA"
            exit 1
          fi

      - name: Check out exact source without retained credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout boundary
        run: |
          [[ "$(git rev-parse HEAD)" == "$SIGIL_EXPECTED_SOURCE_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          if git config --local --get-regexp 'http\..*\.extraheader' >/dev/null; then
            echo "::error::Checkout retained a credential header"
            exit 1
          fi

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Run only the isolated About diagnostic
        id: about
        env:
          SIGIL_SIDEBAR_ARTIFACTS: ${{ runner.temp }}/sigil-about-${{ github.run_id }}-${{ github.run_attempt }}
        run: Scripts/sidebar-host-test.sh --about-only

      - name: Retain About diagnostic evidence
        if: always() && steps.about.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: about-host-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: ${{ runner.temp }}/sigil-about-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
