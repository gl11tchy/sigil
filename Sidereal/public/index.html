<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sidereal">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <title>Sidereal</title>
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <header><h1>Sidereal</h1><span id="status" role="status">Not connected</span></header>
  <main>
    <section id="welcome"><h2>Your Mac, from here.</h2><p>Open Sigil → Settings → Remote.<br>Scan the code with your phone’s camera.</p></section>
    <p id="error" role="alert" hidden></p>
    <section id="controls" hidden aria-label="Sigil remote control">
      <div class="toolbar"><label for="tabs">Session</label><select id="tabs"></select><button id="new" type="button">New</button></div>
      <pre id="terminal" tabindex="0" aria-label="Terminal output"></pre>
      <div class="keys" aria-label="Terminal keys">
        <button data-key="escape">Esc</button><button data-key="tab">Tab</button>
        <button data-key="up" aria-label="Up arrow">↑</button><button data-key="down" aria-label="Down arrow">↓</button>
        <button data-key="left" aria-label="Left arrow">←</button><button data-key="right" aria-label="Right arrow">→</button>
        <button data-key="backspace" aria-label="Backspace">⌫</button><button data-key="enter">Enter</button>
      </div>
      <form id="compose">
        <label for="message">Message</label>
        <textarea id="message" rows="3" placeholder="Send a message…" maxlength="8192" autocapitalize="sentences"></textarea>
        <div class="actions"><button id="interrupt" type="button">Stop</button><button id="paste" type="button">Paste</button><button id="send" type="submit">Send</button></div>
      </form>
    </section>
  </main>
  <footer><button id="reconnect" hidden>Reconnect</button><button id="forget" hidden>Forget this Mac</button><span>Keep Sigil open and your Mac awake.</span></footer>
</body>
</html>
