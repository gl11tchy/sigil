<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sidereal">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <title>Sidereal</title>
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <header>
    <h1 id="brand">Sigil</h1>
    <div id="session-toolbar" class="toolbar" hidden>
      <div class="session-picker"><label for="tabs">Sigil</label><select id="tabs" aria-label="Session"></select><span class="session-chevron" aria-hidden="true">⌄</span></div>
      <button id="new" type="button" aria-label="New session">New</button>
    </div>
    <details class="connection">
      <summary aria-label="Connection settings"><span id="status" role="status">Not connected</span><span aria-hidden="true">⌄</span></summary>
      <div class="connection-panel">
        <p>Keep Sigil open and your Mac awake.</p>
        <button id="raw-toggle" type="button" aria-pressed="false" hidden>Show raw terminal</button>
        <button id="reconnect" hidden>Reconnect</button>
        <button id="forget" hidden>Forget this Mac</button>
      </div>
    </details>
  </header>
  <main>
    <section id="welcome"><img src="/icon.svg" width="56" height="56" alt=""><h2>Your Mac, from here.</h2><p>Open Sigil → Settings → Remote.<br>Scan the code with your phone’s camera.</p></section>
    <p id="error" role="alert" hidden></p>
    <section id="controls" hidden aria-label="Sigil remote control">
      <div class="output">
        <div id="empty-output" hidden><h2>Ready when you are.</h2><p>Send a message to this session.</p></div>
        <pre id="terminal" tabindex="0" aria-label="Terminal output"></pre>
        <button id="latest" type="button" hidden>↓ Latest</button>
      </div>
      <form id="compose">
        <div id="keys" class="keys" aria-label="Terminal keys" hidden>
          <button type="button" data-key="escape">Esc</button><button type="button" data-key="tab">Tab</button>
          <button type="button" data-key="up" aria-label="Up arrow">↑</button><button type="button" data-key="down" aria-label="Down arrow">↓</button>
          <button type="button" data-key="left" aria-label="Left arrow">←</button><button type="button" data-key="right" aria-label="Right arrow">→</button>
          <button type="button" data-key="backspace" aria-label="Backspace">⌫</button><button type="button" data-key="enter">Enter</button>
          <button id="paste" type="button">Paste without sending</button>
          <button id="interrupt" type="button" aria-label="Stop current response">Stop</button>
        </div>
        <div class="entry">
          <button id="keys-toggle" type="button" aria-expanded="false" aria-controls="keys">Keys</button>
          <label class="sr-only" for="message">Message</label>
          <textarea id="message" rows="1" placeholder="Message…" maxlength="8192" autocapitalize="sentences"></textarea>
          <button id="send" type="submit" aria-label="Send message">↑</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
